name: Quality (Lighthouse + accessibility)
# Manual or weekly: needs a built dist/, so it builds the site first (slow, uses the network).
on:
  workflow_dispatch:
  pull_request:
    paths: ["site/**", "pipeline/**", "data/**", "lighthouserc.json"]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v7
        with: {node-version: "22"}
      - run: pip install -r requirements.txt
      - uses: actions/cache@v6
        with:
          path: raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - run: python -m pipeline.build
      - name: Lighthouse budget
        run: npx --yes @lhci/cli@0.14.0 autorun
      - name: Accessibility (axe)
        run: |
          npx --yes http-server dist -p 8000 -s &
          sleep 3
          npx --yes @axe-core/cli@4.10.0 http://localhost:8000/ http://localhost:8000/rankings/ http://localhost:8000/compare/ --exit

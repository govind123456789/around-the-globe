name: Fetch Indian state data

# Manual job: downloads the configured data.gov.in tables with the DATA_GOV_IN_KEY secret and keeps
# them as a run artifact, so the tables can be checked before a deploy. The key is never printed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch data.gov.in tables
        env:
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
        run: python -c "from pipeline import fetch, india; india.fetch(True, fetch._get, fetch._write)"
      - uses: actions/upload-artifact@v7
        with:
          name: datagovin
          path: raw/datagovin
          retention-days: 7

name: Build data release and deploy
# Weekly rebuild from sources, plus manual runs. Requires repository secrets:
#   CLOUDFLARE_API_TOKEN  (Workers Scripts: Edit permission)
#   CLOUDFLARE_ACCOUNT_ID
on:
  schedule:
    - cron: "0 3 * * 1"          # Mondays 03:00 UTC
  workflow_dispatch:

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    # The weekly run stays off until Cloudflare is set up: add the two secrets, then set the
    # repository variable CLOUDFLARE_ENABLED to true. Manual runs always go ahead.
    if: ${{ vars.CLOUDFLARE_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write        # to publish each data release as a GitHub Release (permanent download links)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -r requirements.txt

      # Raw downloads are cached between runs; GDELT only fetches days it doesn't have.
      - uses: actions/cache@v6
        with:
          path: raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Fetch sources (refresh World Bank, UNDP, OECD, CPI weekly)
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}   # optional: a free OpenAlex key raises the daily limit
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}     # data.gov.in API key for Indian state data
        run: |
          rm -rf raw/wb raw/undp raw/oecd raw/ti raw/wikidata/events.csv*
          python -m pipeline.fetch

      - name: Build release (strict licence gate)
        run: RELEASE_DATE=$(date -u +%F) python -m pipeline.build --skip-fetch --strict

      - name: Test the built release
        run: python -m pytest -q pipeline/tests

      # Each data release is kept for good as a GitHub Release. The site redirects
      # /v1/releases/<date>/<file> and /v1/releases/<date>/bulk/<file> there (see _redirects),
      # so links in citations keep working after later weekly rebuilds.
      - name: Archive this release on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL=$(python -c "import json; print(json.load(open('dist/v1/releases.json'))[0]['release'])")
          DIR=dist/v1/releases/$REL
          (cd "$DIR" && zip -qr "$GITHUB_WORKSPACE/api-json-$REL.zip" . -x 'bulk/*')
          TAG=data-$REL
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Data release $REL" --latest=false --target "$GITHUB_SHA" \
              --notes "Around the Globe data release $REL. Bulk tables (Parquet and gzipped CSV), the manifest with checksums, licences and attribution, and the full JSON API as api-json-$REL.zip. Release notes: https://around-the-globe.round-the-globe.workers.dev/insights/releases/$REL/"
          fi
          FILES=$(find "$DIR" -maxdepth 1 -type f; find "$DIR/bulk" -type f)
          gh release upload "$TAG" $FILES "api-json-$REL.zip" --clobber

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.152.0"     # pinned so a new Wrangler release cannot change deploys unannounced
          command: deploy

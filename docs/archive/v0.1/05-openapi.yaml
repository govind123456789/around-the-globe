openapi: 3.1.0
info:
  title: Global Rankings & Intelligence API
  version: 0.1.0
  description: |
    Read API used by the website (MVP) and, later, by Pro/Enterprise clients.
    Conventions:
      * All values carry provenance: source, source_release, period, status.
      * Missing data is omitted or returned as null with a reason — never 0.
      * Calculated values reference a ranking_version; published versions are immutable.
      * Pagination: cursor-based (`cursor`, `limit` ≤ 500). Responses include `next_cursor`.
      * Errors use RFC 9457 problem+json.
servers:
  - url: https://api.example.com/v1
    description: Placeholder until the brand/domain is chosen
tags:
  - name: Entities
  - name: Indicators
  - name: Observations
  - name: Rankings
  - name: Compare
  - name: Search
  - name: Sources
  - name: Custom indices
    description: M5-6 — Index Builder scoring endpoint
  - name: AI research
    description: M5-6 — grounded Q&A
  - name: Feedback

security:
  - {}            # public, rate-limited
  - apiKey: []    # M10-12 paid tiers

paths:
  /entities:
    get:
      tags: [Entities]
      summary: List entities
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/EntityType' } }
        - { name: member_of, in: query, description: Group slug (e.g. south-asia), schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Entity' } }

  /entities/{type}/{slug}:
    get:
      tags: [Entities]
      summary: Entity profile summary
      parameters:
        - { name: type, in: path, required: true, schema: { $ref: '#/components/schemas/EntityType' } }
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityProfile' }
        '301': { description: Slug renamed; Location header points to canonical }
        '404': { $ref: '#/components/responses/NotFound' }

  /entities/{type}/{slug}/rankings:
    get:
      tags: [Entities, Rankings]
      summary: Every published ranking the entity appears in (current editions)
      parameters:
        - { name: type, in: path, required: true, schema: { $ref: '#/components/schemas/EntityType' } }
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EntityRankingPosition' }

  /indicators:
    get:
      tags: [Indicators]
      summary: Indicator catalogue
      parameters:
        - { name: dimension, in: query, schema: { type: string } }
        - { name: applicable_to, in: query, schema: { $ref: '#/components/schemas/EntityType' } }
        - { name: source, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Indicator' } }

  /indicators/{slug}:
    get:
      tags: [Indicators]
      summary: Indicator definition + coverage by year
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Indicator'
                  - properties:
                      coverage_by_year:
                        type: array
                        items:
                          type: object
                          properties:
                            period_label: { type: string }
                            entities_with_data: { type: integer }
                            entities_eligible: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  /observations:
    get:
      tags: [Observations]
      summary: Time series for one indicator across entities, or one entity across indicators
      description: At least one of `indicator` or `entity` is required.
      parameters:
        - { name: indicator, in: query, schema: { type: array, items: { type: string } }, style: form, explode: false }
        - { name: entity, in: query, description: "type:slug, e.g. country:india", schema: { type: array, items: { type: string } }, style: form, explode: false }
        - { name: from, in: query, schema: { type: string, example: '2000' } }
        - { name: to, in: query, schema: { type: string, example: '2024' } }
        - { name: latest, in: query, description: Only the latest current observation per entity/indicator, schema: { type: boolean, default: false } }
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/ObservationStatus' } }, style: form, explode: false }
        - { name: as_of_release, in: query, description: Return values as they stood in a given source release (reproducibility), schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Observation' } }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '451': { $ref: '#/components/responses/LicenceRestricted' }

  /rankings:
    get:
      tags: [Rankings]
      summary: List rankings
      parameters:
        - { name: entity_type, in: query, schema: { $ref: '#/components/schemas/EntityType' } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/RankingKind' } }
        - { name: topic, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RankingSummary' }

  /rankings/{slug}:
    get:
      tags: [Rankings]
      summary: Ranking definition with published versions
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ranking' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rankings/{slug}/results:
    get:
      tags: [Rankings]
      summary: Ranked results for an edition (default = current)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, schema: { type: string } }
        - { name: region, in: query, schema: { type: string } }
        - { name: income_group, in: query, schema: { type: string } }
        - { name: min_coverage, in: query, schema: { type: number, minimum: 0, maximum: 1 } }
        - { name: include_excluded, in: query, schema: { type: boolean, default: true } }
        - { name: include_breakdown, in: query, description: Include pillar and indicator scores, schema: { type: boolean, default: false } }
        - { name: sort, in: query, schema: { type: string, default: rank, example: 'pillar:economic' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ranking_version, results]
                properties:
                  ranking_version: { $ref: '#/components/schemas/RankingVersion' }
                  results: { type: array, items: { $ref: '#/components/schemas/RankingResult' } }
            text/csv:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '451': { $ref: '#/components/responses/LicenceRestricted' }

  /rankings/{slug}/history:
    get:
      tags: [Rankings]
      summary: Rank and score per entity across published editions
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: entity, in: query, schema: { type: array, items: { type: string } }, style: form, explode: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    entity: { $ref: '#/components/schemas/EntityRef' }
                    editions:
                      type: array
                      items:
                        type: object
                        properties:
                          version: { type: string }
                          edition_label: { type: string }
                          rank: { type: [integer, 'null'] }
                          score: { type: [number, 'null'] }

  /rankings/{slug}/methodology:
    get:
      tags: [Rankings]
      summary: Methodology document and full definition for a version
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Methodology' }

  /compare:
    get:
      tags: [Compare]
      summary: Side-by-side comparison of 2–5 entities of the same type
      parameters:
        - name: entities
          in: query
          required: true
          description: "type:slug list, e.g. country:india,country:china"
          schema: { type: array, minItems: 2, maxItems: 5, items: { type: string } }
          style: form
          explode: false
        - { name: indicators, in: query, schema: { type: array, items: { type: string } }, style: form, explode: false }
        - { name: ranking, in: query, description: Use this ranking's indicators and pillars as the lens, schema: { type: string } }
        - { name: align_years, in: query, description: Use latest common period per indicator, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comparison' }
        '400':
          description: Entities of different types, or >5 entities
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /search:
    get:
      tags: [Search]
      summary: Unified search over entities, indicators, rankings, topics, insights
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: types, in: query, schema: { type: array, items: { type: string, enum: [entity, indicator, ranking, topic, insight] } }, style: form, explode: false }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  intent:
                    description: Recognised query pattern, if any
                    oneOf:
                      - type: 'null'
                      - type: object
                        properties:
                          kind: { type: string, enum: [compare, entity_indicator] }
                          redirect_path: { type: string, example: /compare/china-vs-india }
                  hits:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string }
                        slug: { type: string }
                        title: { type: string }
                        subtitle: { type: string }
                        path: { type: string }
                        score: { type: number }

  /sources:
    get:
      tags: [Sources]
      summary: Sources directory with licence terms
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Source' } }

  /sources/{slug}/releases:
    get:
      tags: [Sources]
      summary: Release/retrieval history of a source
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SourceRelease' } }

  /custom-indices/score:
    post:
      tags: [Custom indices]
      summary: Score an ad-hoc index definition (Index Builder preview). Not persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IndexDefinition' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/RankingResult' } }
                  excluded_count: { type: integer }
                  sensitivity:
                    type: object
                    properties:
                      runs: { type: integer }
                      top10_stability: { type: number, description: Share of runs with identical top-10 set }
                  warnings: { type: array, items: { type: string } }
        '422':
          description: Invalid definition (weights don't sum to 1, indicator not applicable to entity type, …)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /ask:
    post:
      tags: [AI research]
      summary: Ask a research question; answer is grounded in tool calls against this API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, maxLength: 2000 }
                context_entities: { type: array, items: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiAnswer' }
        '429': { description: Query quota exceeded for plan }

  /feedback/data-issues:
    post:
      tags: [Feedback]
      summary: Report a data issue on a value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [page_url, message]
              properties:
                page_url: { type: string, format: uri }
                message: { type: string, maxLength: 4000 }
                entity: { type: string }
                indicator: { type: string }
                observation_id: { type: integer }
                reporter_email: { type: string, format: email }
      responses:
        '201': { description: Created }

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }

  responses:
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LicenceRestricted:
      description: Export blocked because at least one source's licence forbids redistribution
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  restricted_sources: { type: array, items: { type: string } }

  schemas:
    EntityType:
      type: string
      enum: [country, country_group, subnational_region, city, university, company, industry, product, public_institution]
    ObservationStatus:
      type: string
      enum: [measured, estimated, projected, modelled, imputed]
    RankingKind:
      type: string
      enum: [official_reproduction, original_composite, single_indicator, user_custom]
    ValueKind:
      type: string
      enum: [observed, calculated, interpretation]

    Page:
      type: object
      properties:
        next_cursor: { type: [string, 'null'] }

    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    EntityRef:
      type: object
      required: [type, slug, name]
      properties:
        type: { $ref: '#/components/schemas/EntityType' }
        slug: { type: string }
        name: { type: string }
        iso3: { type: [string, 'null'] }

    Entity:
      allOf:
        - $ref: '#/components/schemas/EntityRef'
        - type: object
          properties:
            short_name: { type: [string, 'null'] }
            wikidata_qid: { type: [string, 'null'] }
            groups: { type: array, items: { $ref: '#/components/schemas/EntityRef' } }
            attributes: { type: object }

    EntityProfile:
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          properties:
            freshness:
              type: object
              properties:
                indicators_total: { type: integer }
                indicators_on_schedule: { type: integer }
            headline_rankings: { type: array, items: { $ref: '#/components/schemas/EntityRankingPosition' } }
            dimensions:
              type: array
              items:
                type: object
                properties:
                  slug: { type: string }
                  name: { type: string }
                  indicators:
                    type: array
                    items:
                      type: object
                      properties:
                        indicator: { $ref: '#/components/schemas/IndicatorRef' }
                        latest: { $ref: '#/components/schemas/Observation' }
                        world_percentile: { type: [number, 'null'] }
                        sparkline: { type: array, items: { type: array, prefixItems: [{ type: string }, { type: number }] } }
            related: { type: array, items: { $ref: '#/components/schemas/EntityRef' } }

    EntityRankingPosition:
      type: object
      properties:
        ranking: { $ref: '#/components/schemas/RankingSummary' }
        version: { type: string }
        rank: { type: [integer, 'null'] }
        is_tied: { type: boolean }
        of: { type: integer, description: Number of ranked entities }
        movement: { type: [integer, 'null'], description: Positive = moved up since previous edition }
        excluded_reason: { type: [string, 'null'] }

    IndicatorRef:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        unit: { type: string }

    Indicator:
      allOf:
        - $ref: '#/components/schemas/IndicatorRef'
        - type: object
          properties:
            definition: { type: string }
            direction: { type: string, enum: [higher_is_better, lower_is_better, neutral] }
            dimension: { type: string }
            source: { $ref: '#/components/schemas/SourceRef' }
            source_code: { type: [string, 'null'] }
            is_per_capita: { type: boolean }
            absolute_counterpart: { type: [string, 'null'] }
            applicable_to: { type: array, items: { $ref: '#/components/schemas/EntityType' } }
            decimals: { type: integer }

    Observation:
      type: object
      required: [id, entity, indicator, period_label, value, status, source_release]
      properties:
        id: { type: integer }
        kind: { const: observed }
        entity: { $ref: '#/components/schemas/EntityRef' }
        indicator: { type: string }
        period_label: { type: string, example: '2024' }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        value: { type: number }
        status: { $ref: '#/components/schemas/ObservationStatus' }
        lower_bound: { type: [number, 'null'] }
        upper_bound: { type: [number, 'null'] }
        source_release:
          type: object
          properties:
            source: { type: string }
            release_label: { type: string }
            retrieved_at: { type: string, format: date-time }
        superseded: { type: boolean }

    SourceRef:
      type: object
      properties:
        slug: { type: string }
        publisher: { type: string }
        title: { type: string }

    Source:
      allOf:
        - $ref: '#/components/schemas/SourceRef'
        - type: object
          properties:
            homepage_url: { type: string }
            licence_name: { type: string }
            licence_url: { type: [string, 'null'] }
            attribution_text: { type: string }
            allows_redistribution: { type: boolean }
            allows_commercial_use: { type: boolean }
            update_schedule: { type: [string, 'null'] }

    SourceRelease:
      type: object
      properties:
        release_label: { type: string }
        published_at: { type: [string, 'null'], format: date }
        retrieved_at: { type: string, format: date-time }
        row_count: { type: integer }
        rejected_count: { type: integer }

    RankingSummary:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/RankingKind' }
        entity_type: { $ref: '#/components/schemas/EntityType' }
        official_owner: { type: [string, 'null'] }
        current_version: { type: string }
        current_edition_label: { type: string }

    Ranking:
      allOf:
        - $ref: '#/components/schemas/RankingSummary'
        - type: object
          properties:
            summary: { type: string }
            topics: { type: array, items: { type: string } }
            versions: { type: array, items: { $ref: '#/components/schemas/RankingVersion' } }

    RankingVersion:
      type: object
      properties:
        version: { type: string }
        edition_label: { type: string }
        status: { type: string, enum: [published, retired] }
        reference_period_end: { type: string, format: date }
        published_at: { type: string, format: date-time }
        engine_version: { type: string }
        input_snapshot_sha256: { type: string }
        entities_ranked: { type: integer }
        entities_excluded: { type: integer }

    RankingResult:
      type: object
      required: [entity, coverage]
      properties:
        kind: { const: calculated }
        entity: { $ref: '#/components/schemas/EntityRef' }
        rank: { type: [integer, 'null'] }
        is_tied: { type: boolean }
        score: { type: [number, 'null'] }
        movement: { type: [integer, 'null'] }
        coverage: { type: number, minimum: 0, maximum: 1 }
        indicators_used: { type: integer }
        excluded_reason: { type: [string, 'null'] }
        rank_range:
          description: 5th–95th percentile rank under weight perturbation (original composites only)
          type: [object, 'null']
          properties:
            p05: { type: integer }
            p95: { type: integer }
        pillar_scores: { type: object, additionalProperties: { type: number } }
        indicator_scores:
          type: object
          additionalProperties:
            type: object
            properties:
              normalized: { type: number }
              observation_id: { type: integer }

    Methodology:
      type: object
      properties:
        ranking: { $ref: '#/components/schemas/RankingSummary' }
        version: { $ref: '#/components/schemas/RankingVersion' }
        normalization: { type: string }
        aggregation: { type: string }
        missing_policy: { type: string }
        min_coverage: { type: number }
        eligibility_rules: { type: object }
        pillars:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              name: { type: string }
              weight: { type: number }
              indicators:
                type: array
                items:
                  type: object
                  properties:
                    indicator: { $ref: '#/components/schemas/IndicatorRef' }
                    weight: { type: number }
                    direction: { type: string }
                    transform: { type: [string, 'null'] }
                    goalposts: { type: [array, 'null'], items: { type: number } }
        body_md: { type: string }
        limitations_md: { type: string }
        change_log: { type: array, items: { type: object, properties: { version: { type: string }, notes: { type: string } } } }

    Comparison:
      type: object
      properties:
        entities: { type: array, items: { $ref: '#/components/schemas/EntityRef' } }
        canonical_path: { type: string, example: /compare/china-vs-india }
        rows:
          type: array
          items:
            type: object
            properties:
              indicator: { $ref: '#/components/schemas/IndicatorRef' }
              dimension: { type: string }
              values:
                type: array
                description: Same order as `entities`; null when no data
                items:
                  oneOf:
                    - type: 'null'
                    - $ref: '#/components/schemas/Observation'
              periods_differ: { type: boolean }
        pillars:
          description: Present when `ranking` lens is used
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              scores: { type: array, items: { type: [number, 'null'] } }

    IndexDefinition:
      type: object
      required: [entity_type, indicators, normalization, aggregation, missing_policy]
      properties:
        entity_type: { $ref: '#/components/schemas/EntityType' }
        eligibility:
          type: object
          properties:
            groups: { type: array, items: { type: string } }
            min_population: { type: integer }
        reference_period_end: { type: string, example: '2024' }
        indicators:
          type: array
          minItems: 1
          items:
            type: object
            required: [slug, weight]
            properties:
              slug: { type: string }
              weight: { type: number, exclusiveMinimum: 0, maximum: 1 }
              pillar: { type: string }
              direction_override: { type: string, enum: [higher_is_better, lower_is_better] }
              transform: { type: string }
        pillar_weights: { type: object, additionalProperties: { type: number } }
        normalization: { type: string, enum: [min_max, min_max_goalposts, z_score, rank_percentile, log_min_max] }
        aggregation: { type: string, enum: [weighted_arithmetic, weighted_geometric, pillar_of_pillars] }
        missing_policy: { type: string, enum: [exclude_entity, reweight_available] }
        min_coverage: { type: number, default: 0.7 }

    AiAnswer:
      type: object
      properties:
        id: { type: integer }
        kind: { const: interpretation }
        answer_md: { type: string, description: 'Figures carry [^n] citation markers' }
        grounded: { type: boolean, description: false when the question could not be answered from data }
        unanswered: { type: array, items: { type: string }, description: Parts of the question lacking data }
        citations:
          type: array
          items:
            type: object
            properties:
              marker: { type: string }
              observation_id: { type: [integer, 'null'] }
              ranking_version: { type: [string, 'null'] }
              label: { type: string }
        tool_calls:
          type: array
          items:
            type: object
            properties:
              tool: { type: string }
              arguments: { type: object }
              result_ref: { type: string }
        model: { type: string }

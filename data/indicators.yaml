# Indicator catalogue. Each indicator maps to exactly one source in licences.yaml.
# direction: higher_better | lower_better | neutral
# transform: log (applied before normalisation in composites)
# bounds: plausible range for validation (values outside are rejected)

dimensions:
  - { id: economy,     name: Economy,               blurb: "Output, growth, prices, jobs and trade." }
  - { id: human,       name: Human development,     blurb: "The UNDP Human Development Index and its components." }
  - { id: innovation,  name: Innovation & technology, blurb: "Research effort, connectivity and high-tech output." }
  - { id: health,      name: Health,                blurb: "Survival, health spending and access to care." }
  - { id: education,   name: Education,             blurb: "Enrolment and spending on education." }
  - { id: environment, name: Environment & energy,  blurb: "Emissions, clean energy, access to electricity, air quality." }
  - { id: demography,  name: Demography,            blurb: "Population size, growth, age and urbanisation." }
  - { id: society,     name: Society & inclusion,   blurb: "Gender, poverty and inequality." }
  - { id: governance,  name: Governance,            blurb: "Perceived corruption and the size of the tax state." }
  - { id: safety,      name: Safety & security,     blurb: "Violent crime, road deaths and suicide." }
  - { id: media,       name: Media attention,       blurb: "How much, and how positively, the world's online news covers each country." }

indicators:
  # ---------------- Economy (World Bank WDI) ----------------
  - { id: gdp,               source: wb-wdi, code: NY.GDP.MKTP.CD,       dimension: economy, direction: neutral,       unit: "current US$",               decimals: 0, bounds: [0, 1.0e14],  name: "GDP",                          definition: "Gross domestic product at purchaser's prices, in current US dollars.", transform: log }
  - { id: gdp-per-capita-ppp, source: wb-wdi, code: NY.GDP.PCAP.PP.CD,  dimension: economy, direction: higher_better, unit: "current international $",   decimals: 0, bounds: [100, 300000], name: "GDP per capita, PPP",          definition: "GDP per person converted to international dollars using purchasing power parity rates.", transform: log }
  - { id: gdp-growth,        source: wb-wdi, code: NY.GDP.MKTP.KD.ZG,    dimension: economy, direction: higher_better, unit: "% annual",                  decimals: 1, bounds: [-80, 150],   name: "GDP growth",                   definition: "Annual percentage growth rate of GDP at market prices in constant local currency." }
  - { id: inflation,         source: wb-wdi, code: FP.CPI.TOTL.ZG,       dimension: economy, direction: lower_better,  unit: "% annual",                  decimals: 1, bounds: [-30, 50000], name: "Inflation, consumer prices",   definition: "Annual percentage change in the cost to the average consumer of a basket of goods and services." }
  - { id: unemployment,      source: wb-wdi, status: estimate, code: SL.UEM.TOTL.ZS,       dimension: economy, direction: lower_better,  unit: "% of labour force",         decimals: 1, bounds: [0, 60],      name: "Unemployment",                 definition: "Share of the labour force without work but available for and seeking employment (modelled ILO estimate)." }
  - { id: exports-gdp,       source: wb-wdi, code: NE.EXP.GNFS.ZS,       dimension: economy, direction: neutral,       unit: "% of GDP",                  decimals: 1, bounds: [0, 400],     name: "Exports of goods and services", definition: "Value of all goods and market services provided to the rest of the world, as a share of GDP." }
  - { id: manufacturing-gdp, source: wb-wdi, code: NV.IND.MANF.ZS,       dimension: economy, direction: neutral,       unit: "% of GDP",                  decimals: 1, bounds: [0, 80],      name: "Manufacturing, value added",   definition: "Net output of the manufacturing sector as a share of GDP." }
  - { id: fdi-inflows,       source: wb-wdi, code: BX.KLT.DINV.WD.GD.ZS, dimension: economy, direction: neutral,       unit: "% of GDP",                  decimals: 1, bounds: [-2000, 2000],  name: "Foreign direct investment, net inflows", definition: "Net inflows of investment to acquire a lasting management interest, as a share of GDP." }

  # ---------------- Economy (OECD) ----------------
  - { id: average-wage,      source: oecd, code: "OECD.ELS.SAE,DSD_EARNINGS@AV_AN_WAGE,1.0/.WG.USD_PPP.A.Q.MEAN._Z", dimension: economy, direction: higher_better, unit: "2025 US$ PPP", decimals: 0, bounds: [1000, 200000], name: "Average annual wage", definition: "Average annual wage per full-time equivalent employee, in constant 2025 US dollars at purchasing power parity. OECD members and partners." }

  # ---------------- Human development (UNDP HDR) ----------------
  - { id: hdi,               source: undp-hdr, code: hdi,   dimension: human, direction: higher_better, unit: "index (0–1)",              decimals: 3, bounds: [0, 1],      name: "Human Development Index", definition: "UNDP's summary measure of a long and healthy life, knowledge and a decent standard of living." }
  - { id: expected-schooling, source: undp-hdr, code: eys,  dimension: human, direction: higher_better, unit: "years",                    decimals: 1, bounds: [0, 30],     name: "Expected years of schooling", definition: "Years of schooling a child of school entrance age can expect to receive if current enrolment rates persist." }
  - { id: mean-schooling,    source: undp-hdr, code: mys,   dimension: human, direction: higher_better, unit: "years",                    decimals: 1, bounds: [0, 20],     name: "Mean years of schooling", definition: "Average number of years of education received by people aged 25 and older." }
  - { id: gni-per-capita,    source: undp-hdr, code: gnipc, dimension: human, direction: higher_better, unit: "2021 PPP $",               decimals: 0, bounds: [100, 300000], name: "GNI per capita (HDR)", definition: "Gross national income per person in 2021 purchasing-power-parity dollars, as used in the HDI." }
  - { id: life-expectancy-hdr, source: undp-hdr, code: le,  dimension: human, direction: higher_better, unit: "years",                    decimals: 1, bounds: [20, 95],    name: "Life expectancy (HDR)", definition: "Life expectancy at birth as used in the HDI." }

  # ---------------- Innovation & technology ----------------
  - { id: rd-spending,       source: wb-wdi, code: GB.XPD.RSDV.GD.ZS,    dimension: innovation, direction: higher_better, unit: "% of GDP",            decimals: 2, bounds: [0, 10],     name: "R&D expenditure",               definition: "Gross domestic expenditure on research and experimental development as a share of GDP." }
  - { id: researchers,       source: wb-wdi, code: SP.POP.SCIE.RD.P6,    dimension: innovation, direction: higher_better, unit: "per million people",  decimals: 0, bounds: [0, 30000],  name: "Researchers in R&D",            definition: "Professionals engaged in creating new knowledge, per million people.", transform: log }
  - { id: internet-users,    source: wb-wdi, code: IT.NET.USER.ZS,       dimension: innovation, direction: higher_better, unit: "% of population",     decimals: 1, bounds: [0, 100],    name: "Internet users",                definition: "Share of the population that used the internet in the last three months." }
  - { id: high-tech-exports, source: wb-wdi, code: TX.VAL.TECH.MF.ZS,    dimension: innovation, direction: higher_better, unit: "% of manufactured exports", decimals: 1, bounds: [0, 100], name: "High-technology exports",      definition: "Exports of products with high R&D intensity, as a share of manufactured exports." }
  - { id: patents-residents, source: wb-wdi, code: IP.PAT.RESD,          dimension: innovation, direction: higher_better, unit: "applications",        decimals: 0, bounds: [0, 5.0e6],  name: "Patent applications, residents", definition: "Patent applications filed by residents through the Patent Cooperation Treaty or with a national office.", transform: log }
  - { id: mobile-subs,       source: wb-wdi, code: IT.CEL.SETS.P2,       dimension: innovation, direction: higher_better, unit: "per 100 people",      decimals: 0, bounds: [0, 450],    name: "Mobile cellular subscriptions", definition: "Subscriptions to a public mobile telephone service, per 100 people." }

  # ---------------- Health ----------------
  - { id: life-expectancy,   source: wb-wdi, code: SP.DYN.LE00.IN,       dimension: health, direction: higher_better, unit: "years",                   decimals: 1, bounds: [20, 95],    name: "Life expectancy at birth",  definition: "Years a newborn would live if prevailing patterns of mortality at the time of birth stayed the same." }
  - { id: infant-mortality,  source: wb-wdi, code: SP.DYN.IMRT.IN,       dimension: health, direction: lower_better,  unit: "per 1,000 live births",   decimals: 1, bounds: [0, 300],    name: "Infant mortality rate",     definition: "Deaths of infants under one year old per 1,000 live births." }
  - { id: maternal-mortality, source: wb-wdi, status: estimate, code: SH.STA.MMRT,         dimension: health, direction: lower_better,  unit: "per 100,000 live births", decimals: 0, bounds: [0, 3000],   name: "Maternal mortality ratio",  definition: "Women who die from pregnancy-related causes per 100,000 live births (modelled estimate)." }
  - { id: health-spending,   source: wb-wdi, code: SH.XPD.CHEX.PC.CD,    dimension: health, direction: higher_better, unit: "current US$ per person",  decimals: 0, bounds: [0, 20000],  name: "Health expenditure per capita", definition: "Current health expenditure per person, in current US dollars.", transform: log }
  - { id: physicians,        source: wb-wdi, code: SH.MED.PHYS.ZS,       dimension: health, direction: higher_better, unit: "per 1,000 people",        decimals: 1, bounds: [0, 15],     name: "Physicians",                definition: "Generalist and specialist medical practitioners per 1,000 people." }

  # ---------------- Education ----------------
  - { id: education-spending, source: wb-wdi, code: SE.XPD.TOTL.GD.ZS,   dimension: education, direction: higher_better, unit: "% of GDP",           decimals: 1, bounds: [0, 20],     name: "Government spending on education", definition: "General government expenditure on education as a share of GDP." }
  - { id: tertiary-enrolment, source: wb-wdi, code: SE.TER.ENRR,         dimension: education, direction: higher_better, unit: "% gross",            decimals: 1, bounds: [0, 200],    name: "Tertiary enrolment",        definition: "Total tertiary enrolment as a share of the population in the five-year age group after secondary school." }
  - { id: secondary-enrolment, source: wb-wdi, code: SE.SEC.ENRR,        dimension: education, direction: higher_better, unit: "% gross",            decimals: 1, bounds: [0, 200],    name: "Secondary enrolment",       definition: "Total secondary enrolment as a share of the official secondary-school-age population." }

  # ---------------- Environment & energy ----------------
  - { id: co2-per-capita,    source: wb-wdi, code: EN.GHG.CO2.PC.CE.AR5, dimension: environment, direction: lower_better,  unit: "t CO₂e per person",  decimals: 1, bounds: [0, 100],   name: "CO₂ emissions per capita",   definition: "Carbon dioxide emissions excluding land use change, in tonnes of CO₂ equivalent per person." }
  - { id: renewable-share,   source: wb-wdi, code: EG.FEC.RNEW.ZS,       dimension: environment, direction: higher_better, unit: "% of final energy",  decimals: 1, bounds: [0, 100],   name: "Renewable energy share",     definition: "Renewable energy as a share of total final energy consumption." }
  - { id: electricity-access, source: wb-wdi, code: EG.ELC.ACCS.ZS,      dimension: environment, direction: higher_better, unit: "% of population",    decimals: 1, bounds: [0, 100],   name: "Access to electricity",      definition: "Share of the population with access to electricity." }
  - { id: forest-area,       source: wb-wdi, code: AG.LND.FRST.ZS,       dimension: environment, direction: neutral,       unit: "% of land area",     decimals: 1, bounds: [0, 100],   name: "Forest area",                definition: "Land under natural or planted stands of trees of at least 5 metres, as a share of land area." }
  - { id: pm25,              source: wb-wdi, status: estimate, code: EN.ATM.PM25.MC.M3,    dimension: environment, direction: lower_better,  unit: "µg/m³",              decimals: 1, bounds: [0, 200],   name: "PM2.5 air pollution",        definition: "Mean annual population-weighted exposure to fine particulate matter (PM2.5)." }

  # ---------------- Demography ----------------
  - { id: population,        source: wb-wdi, code: SP.POP.TOTL,          dimension: demography, direction: neutral, unit: "people",            decimals: 0, bounds: [0, 2.0e9],  name: "Population",               definition: "All residents regardless of legal status or citizenship (midyear estimate).", transform: log }
  - { id: population-growth, source: wb-wdi, code: SP.POP.GROW,          dimension: demography, direction: neutral, unit: "% annual",          decimals: 2, bounds: [-40, 40],   name: "Population growth",        definition: "Annual population growth rate." }
  - { id: urban-share,       source: wb-wdi, code: SP.URB.TOTL.IN.ZS,    dimension: demography, direction: neutral, unit: "% of population",   decimals: 1, bounds: [0, 100],    name: "Urban population",         definition: "Share of people living in urban areas as defined by national statistical offices." }
  - { id: fertility,         source: wb-wdi, code: SP.DYN.TFRT.IN,       dimension: demography, direction: neutral, unit: "births per woman",  decimals: 2, bounds: [0.5, 9],    name: "Fertility rate",           definition: "Births a woman would have if she lived to the end of her childbearing years at current age-specific rates." }
  - { id: aged-65,           source: wb-wdi, code: SP.POP.65UP.TO.ZS,    dimension: demography, direction: neutral, unit: "% of population",   decimals: 1, bounds: [0, 50],     name: "Population aged 65+",      definition: "People aged 65 and above as a share of the total population." }

  # ---------------- Society & inclusion ----------------
  - { id: women-parliament,  source: wb-wdi, code: SG.GEN.PARL.ZS,       dimension: society, direction: higher_better, unit: "% of seats",       decimals: 1, bounds: [0, 100],   name: "Women in parliament",            definition: "Share of seats held by women in national parliaments (single or lower chamber)." }
  - { id: female-labour,     source: wb-wdi, status: estimate, code: SL.TLF.CACT.FE.ZS,    dimension: society, direction: higher_better, unit: "% of women 15+",   decimals: 1, bounds: [0, 100],   name: "Female labour-force participation", definition: "Share of women aged 15+ who are economically active (modelled ILO estimate)." }
  - { id: extreme-poverty,   source: wb-wdi, code: SI.POV.DDAY,          dimension: society, direction: lower_better,  unit: "% of population",  decimals: 1, bounds: [0, 100],   name: "Extreme poverty",                definition: "Share of the population living below the international poverty line (2021 PPP)." }
  - { id: gini,              source: wb-wdi, code: SI.POV.GINI,          dimension: society, direction: lower_better,  unit: "index (0–100)",    decimals: 1, bounds: [15, 75],   name: "Gini index",                     definition: "Extent to which the distribution of income or consumption deviates from perfect equality." }

  # ---------------- Governance ----------------
  - { id: cpi,               source: ti-cpi, code: cpi_score,  dimension: governance, direction: higher_better, unit: "score (0–100)", decimals: 0, bounds: [0, 100], display_only: true, name: "Corruption Perceptions Index", definition: "Perceived level of public-sector corruption according to experts and business people, from 0 (highly corrupt) to 100 (very clean). Comparable from 2012. Shown exactly as published by Transparency International; never rescaled or used in composite indices." }
  - { id: tax-revenue,       source: oecd,   code: "OECD.CTP.TPS,DSD_REV_COMP_GLOBAL@DF_RSGLOBAL,2.1/.TAX_REV.S13._T._T.PT_B1GQ.A", dimension: governance, direction: neutral, unit: "% of GDP", decimals: 1, bounds: [0, 80], name: "Tax revenue", definition: "Total tax revenue of general government, including social security contributions, as a share of GDP (OECD Global Revenue Statistics)." }

  # ---------------- Media attention (GDELT) ----------------
  - { id: news-share,        source: gdelt,  code: NumArticles,  dimension: media, direction: neutral, unit: "% of news articles about events", decimals: 2, bounds: [0, 100], transform: log, name: "Share of global news coverage", definition: "Share of all online news articles about events worldwide, as recorded by GDELT, that report events taking place in the country. Calculated from every third day of GDELT's daily event files over the last three months." }
  - { id: news-tone,         source: gdelt,  code: AvgTone,      dimension: media, direction: neutral, unit: "average tone", decimals: 2, bounds: [-100, 100], name: "Tone of news coverage", definition: "Article-weighted average tone of online news about events in the country over the last three months, from GDELT's sentiment scoring. Negative values mean more negative language; most countries score below zero." }

  # ---------------- Added 2026-10-29: more economy, digital, health, education, environment,
  # ---------------- demography, inclusion, safety, governance (WGI) and UNDP HDR series
  - { id: "gni-per-capita-atlas", source: "wb-wdi", code: "NY.GNP.PCAP.CD", dimension: "economy", direction: "higher_better", unit: "current US$", decimals: 0, bounds: [10, 300000], transform: "log", name: "GNI per capita (Atlas method)", definition: "Gross national income per person converted to US dollars with the World Bank Atlas method; the basis of the World Bank's income groups." }
  - { id: "trade-gdp", source: "wb-wdi", code: "NE.TRD.GNFS.ZS", dimension: "economy", direction: "neutral", unit: "% of GDP", decimals: 1, bounds: [0, 1000], name: "Trade", definition: "Exports plus imports of goods and services as a share of GDP." }
  - { id: "tax-revenue-wb", source: "wb-wdi", code: "GC.TAX.TOTL.GD.ZS", dimension: "governance", direction: "neutral", unit: "% of GDP", decimals: 1, bounds: [0, 80], name: "Tax revenue (central government)", definition: "Compulsory transfers to central government for public purposes, as a share of GDP (World Bank, wider coverage than OECD)." }
  - { id: "current-account", source: "wb-wdi", code: "BN.CAB.XOKA.GD.ZS", dimension: "economy", direction: "neutral", unit: "% of GDP", decimals: 1, bounds: [-400, 400], name: "Current account balance", definition: "Net exports of goods and services, net primary income and net secondary income, as a share of GDP." }
  - { id: "investment-gdp", source: "wb-wdi", code: "NE.GDI.TOTL.ZS", dimension: "economy", direction: "neutral", unit: "% of GDP", decimals: 1, bounds: [-20, 100], name: "Gross capital formation", definition: "Spending on fixed assets and changes in inventories (investment) as a share of GDP." }
  - { id: "youth-unemployment", source: "wb-wdi", code: "SL.UEM.1524.ZS", dimension: "economy", direction: "lower_better", unit: "% of labour force 15–24", decimals: 1, bounds: [0, 100], status: "estimate", name: "Youth unemployment", definition: "Share of the labour force aged 15–24 without work but available for and seeking employment (modelled ILO estimate)." }
  - { id: "private-credit", source: "wb-wdi", code: "FS.AST.PRVT.GD.ZS", dimension: "economy", direction: "neutral", unit: "% of GDP", decimals: 1, bounds: [0, 400], name: "Domestic credit to the private sector", definition: "Financial resources provided to the private sector by financial corporations, as a share of GDP." }
  - { id: "remittances", source: "wb-wdi", code: "BX.TRF.PWKR.DT.GD.ZS", dimension: "economy", direction: "neutral", unit: "% of GDP", decimals: 1, bounds: [0, 200], name: "Personal remittances received", definition: "Money sent home by workers abroad and compensation of non-resident employees, as a share of GDP." }
  - { id: "agriculture-gdp", source: "wb-wdi", code: "NV.AGR.TOTL.ZS", dimension: "economy", direction: "neutral", unit: "% of GDP", decimals: 1, bounds: [0, 100], name: "Agriculture, forestry and fishing, value added", definition: "Net output of agriculture, forestry and fishing as a share of GDP." }
  - { id: "services-gdp", source: "wb-wdi", code: "NV.SRV.TOTL.ZS", dimension: "economy", direction: "neutral", unit: "% of GDP", decimals: 1, bounds: [0, 100], name: "Services, value added", definition: "Net output of the services sector as a share of GDP." }
  - { id: "agri-employment", source: "wb-wdi", code: "SL.AGR.EMPL.ZS", dimension: "economy", direction: "neutral", unit: "% of employment", decimals: 1, bounds: [0, 100], status: "estimate", name: "Employment in agriculture", definition: "Share of employed people working in agriculture, forestry and fishing (modelled ILO estimate)." }
  - { id: "government-debt", source: "wb-wdi", code: "GC.DOD.TOTL.GD.ZS", dimension: "governance", direction: "neutral", unit: "% of GDP", decimals: 1, bounds: [0, 400], name: "Central government debt", definition: "Gross debt liabilities of central government as a share of GDP." }
  - { id: "fixed-broadband", source: "wb-wdi", code: "IT.NET.BBND.P2", dimension: "innovation", direction: "higher_better", unit: "per 100 people", decimals: 1, bounds: [0, 100], name: "Fixed broadband subscriptions", definition: "Fixed subscriptions to high-speed internet (256 kbit/s or more), per 100 people." }
  - { id: "scientific-articles", source: "wb-wdi", code: "IP.JRN.ARTC.SC", dimension: "innovation", direction: "higher_better", unit: "articles", decimals: 0, bounds: [0, 5000000], transform: "log", name: "Scientific and technical journal articles", definition: "Articles published in science and engineering fields, counted by authors' country." }
  - { id: "ict-service-exports", source: "wb-wdi", code: "BX.GSR.CCIS.ZS", dimension: "innovation", direction: "higher_better", unit: "% of service exports", decimals: 1, bounds: [0, 100], name: "ICT service exports", definition: "Telecommunications, computer and information services as a share of all service exports." }
  - { id: "secure-servers", source: "wb-wdi", code: "IT.NET.SECR.P6", dimension: "innovation", direction: "higher_better", unit: "per million people", decimals: 0, bounds: [0, 10000000], transform: "log", name: "Secure internet servers", definition: "Distinct, publicly trusted TLS/SSL certificates per million people." }
  - { id: "health-spending-gdp", source: "wb-wdi", code: "SH.XPD.CHEX.GD.ZS", dimension: "health", direction: "neutral", unit: "% of GDP", decimals: 1, bounds: [0, 30], name: "Health expenditure", definition: "Current health expenditure as a share of GDP." }
  - { id: "measles-immunization", source: "wb-wdi", code: "SH.IMM.MEAS", dimension: "health", direction: "higher_better", unit: "% of children 12–23 months", decimals: 0, bounds: [0, 100], name: "Measles immunisation", definition: "Share of children aged 12–23 months who received a measles vaccination." }
  - { id: "stunting", source: "wb-wdi", code: "SH.STA.STNT.ZS", dimension: "health", direction: "lower_better", unit: "% of children under 5", decimals: 1, bounds: [0, 80], name: "Child stunting", definition: "Share of children under 5 whose height for age is more than two standard deviations below the median." }
  - { id: "under5-mortality", source: "wb-wdi", code: "SH.DYN.MORT", dimension: "health", direction: "lower_better", unit: "per 1,000 live births", decimals: 1, bounds: [0, 400], name: "Under-5 mortality rate", definition: "Probability per 1,000 that a newborn baby dies before reaching age five." }
  - { id: "hospital-beds", source: "wb-wdi", code: "SH.MED.BEDS.ZS", dimension: "health", direction: "higher_better", unit: "per 1,000 people", decimals: 1, bounds: [0, 30], name: "Hospital beds", definition: "Inpatient beds in public, private, general and specialised hospitals, per 1,000 people." }
  - { id: "basic-sanitation", source: "wb-wdi", code: "SH.STA.BASS.ZS", dimension: "health", direction: "higher_better", unit: "% of population", decimals: 1, bounds: [0, 100], name: "Basic sanitation", definition: "Share of people using at least basic sanitation services." }
  - { id: "basic-water", source: "wb-wdi", code: "SH.H2O.BASW.ZS", dimension: "health", direction: "higher_better", unit: "% of population", decimals: 1, bounds: [0, 100], name: "Basic drinking water", definition: "Share of people using at least basic drinking water services." }
  - { id: "out-of-pocket", source: "wb-wdi", code: "SH.XPD.OOPC.CH.ZS", dimension: "health", direction: "lower_better", unit: "% of health spending", decimals: 1, bounds: [0, 100], name: "Out-of-pocket health spending", definition: "Health spending paid directly by households, as a share of current health expenditure." }
  - { id: "undernourishment", source: "wb-wdi", code: "SN.ITK.DEFC.ZS", dimension: "health", direction: "lower_better", unit: "% of population", decimals: 1, bounds: [0, 100], status: "estimate", name: "Undernourishment", definition: "Share of the population whose habitual food intake is insufficient for an active, healthy life (FAO estimate)." }
  - { id: "tb-incidence", source: "wb-wdi", code: "SH.TBS.INCD", dimension: "health", direction: "lower_better", unit: "per 100,000 people", decimals: 0, bounds: [0, 2000], status: "estimate", name: "Tuberculosis incidence", definition: "Estimated new and relapse tuberculosis cases per 100,000 people." }
  - { id: "life-expectancy-female", source: "wb-wdi", code: "SP.DYN.LE00.FE.IN", dimension: "health", direction: "higher_better", unit: "years", decimals: 1, bounds: [20, 100], name: "Life expectancy, female", definition: "Life expectancy at birth for women." }
  - { id: "life-expectancy-male", source: "wb-wdi", code: "SP.DYN.LE00.MA.IN", dimension: "health", direction: "higher_better", unit: "years", decimals: 1, bounds: [20, 100], name: "Life expectancy, male", definition: "Life expectancy at birth for men." }
  - { id: "primary-completion", source: "wb-wdi", code: "SE.PRM.CMPT.ZS", dimension: "education", direction: "higher_better", unit: "% of relevant age group", decimals: 1, bounds: [0, 200], name: "Primary completion rate", definition: "New entrants to the last grade of primary school as a share of children of that age (can exceed 100%)." }
  - { id: "literacy", source: "wb-wdi", code: "SE.ADT.LITR.ZS", dimension: "education", direction: "higher_better", unit: "% of people 15+", decimals: 1, bounds: [0, 100], name: "Adult literacy rate", definition: "Share of people aged 15 and over who can read and write a short simple statement about everyday life." }
  - { id: "preprimary-enrolment", source: "wb-wdi", code: "SE.PRE.ENRR", dimension: "education", direction: "higher_better", unit: "% gross", decimals: 1, bounds: [0, 200], name: "Pre-primary enrolment", definition: "Total pre-primary enrolment as a share of the official pre-primary age group." }
  - { id: "lower-secondary-completion", source: "wb-wdi", code: "SE.SEC.CMPT.LO.ZS", dimension: "education", direction: "higher_better", unit: "% of relevant age group", decimals: 1, bounds: [0, 200], name: "Lower secondary completion rate", definition: "New entrants to the last grade of lower secondary school as a share of children of that age." }

    status: { CHN: permanent, FRA: permanent, RUS: permanent, GBR: permanent, USA: permanent }

# Treaties: listed by their few non-parties, which are well documented.
treaties:
  - id: npt
    name: Nuclear Non-Proliferation Treaty
    url: https://disarmament.unoda.org/wmd/nuclear/npt/
    blurb: "Almost every state is a party. India, Pakistan and Israel never joined; South Sudan has not acceded; North Korea announced its withdrawal in 2003."
    outside: { IND: "never joined", PAK: "never joined", ISR: "never joined", SSD: "not acceded", PRK: "withdrew (2003)" }
  - id: paris
    name: Paris Agreement on climate change
    url: https://unfccc.int/process/the-paris-agreement/status-of-ratification
    blurb: "Almost every state is a party. Iran, Libya and Yemen signed but have not ratified; the United States withdrew with effect from January 2026."
    outside: { IRN: "signed, not ratified", LBY: "signed, not ratified", YEM: "signed, not ratified", USA: "withdrew (2026)" }


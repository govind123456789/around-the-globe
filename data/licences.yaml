  - { source_id: v-dem,         publisher: V-Dem Institute,            title: "V-Dem dataset v16 (via Our World in Data)", url: https://www.v-dem.net/data/the-v-dem-dataset/, licence: CC BY-SA 4.0, licence_url: https://creativecommons.org/licenses/by-sa/4.0/, tier: green, commercial_ok: true, derivatives_ok: true, share_alike: true, no_modification: false,

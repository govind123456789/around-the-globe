    licence_checked_on: 2026-10-24
    notes: Download page states "All datasets are free of charge and licensed under CC BY 4.0".

  # ---- Not ingested. Listed so the gate recognises them if someone adds an indicator. ----
  - { source_id: imf,           publisher: International Monetary Fund, title: IMF data,          url: https://www.imf.org/en/Data,  licence: Permission required, tier: amber, commercial_ok: false, derivatives_ok: true, share_alike: false, no_modification: false, attribution_text: "", licence_checked_on: 2026-11-09,
      notes: "Read imf.org/en/About/copyright-and-terms on 2026-11-09: derivative works allowed with attribution, but commercial reuse needs written permission (copyright@imf.org). That conflicts with CC BY outputs, so IMF data is not used until permission is granted." }
  - { source_id: who-gho,       publisher: World Health Organization,  title: Global Health Observatory, url: https://www.who.int/data/gho, licence: Restricted commercial use, tier: amber, commercial_ok: false, derivatives_ok: false, share_alike: false, no_modification: false, attribution_text: "", licence_checked_on: 2026-11-09,
      notes: "WHO data terms read 2026-11-09: use for public-health purposes, no promotion of a commercial enterprise, only minimal changes without written permission. Not used directly; WHO series that the World Bank republishes under CC BY 4.0 (checked per series) are used instead." }
  - { source_id: sipri,         publisher: SIPRI,                      title: SIPRI databases,   url: https://www.sipri.org/databases, licence: Permission required, tier: red, commercial_ok: false, derivatives_ok: false, share_alike: false, no_modification: false, attribution_text: "", licence_checked_on: 2026-11-09,

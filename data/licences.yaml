  - { source_id: unvotes,       publisher: "Bailey, Strezhnev and Voeten (Harvard Dataverse)", title: United Nations General Assembly Voting Data, url: https://doi.org/10.7910/DVN/LEJUQZ, licence: CC0 1.0, licence_url: https://creativecommons.org/publicdomain/zero/1.0/, tier: green, commercial_ok: true, derivatives_ok: true, share_alike: false, no_modification: false,

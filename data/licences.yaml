# Licence registry. The build refuses to publish any indicator whose source is not
# tier: green, and refuses share-alike / no-modification inputs to CC BY composites.
# licence_checked_on: set this to the date you read the publisher's licence page.
# `python -m pipeline.build --strict` (used in CI releases) fails if it is null.
# Terms below come from the research report (20 Oct 2026); this is not legal advice.

sources:
  - source_id: wb-wdi
    publisher: World Bank
    title: World Development Indicators
    url: https://datacatalog.worldbank.org/search/dataset/0037712
    licence: CC BY 4.0
    licence_url: https://datacatalog.worldbank.org/public-licenses
    tier: green
    commercial_ok: true
    derivatives_ok: true
    share_alike: false
    no_modification: false
    attribution_text: "World Bank, World Development Indicators. Licensed under CC BY 4.0."
    licence_checked_on: 2026-10-24
    notes: >-
      Read 2026-10-24: WDI dataset record states 'License: Creative Commons Attribution 4.0'; CC BY 4.0 is the World Bank default. Re-check individual series added later.

  - source_id: wb-wgi
    publisher: World Bank
    title: Worldwide Governance Indicators
    url: https://datacatalog.worldbank.org/search/dataset/0038026/Worldwide-Governance-Indicators
    licence: CC BY 4.0
    licence_url: https://datacatalog.worldbank.org/public-licenses#cc-by
    tier: green
    commercial_ok: true
    derivatives_ok: true
    share_alike: false
    no_modification: false
    attribution_text: "World Bank, Worldwide Governance Indicators (2026 release). Licensed under CC BY 4.0."
    licence_checked_on: 2026-10-29
    notes: >-
      Dataset record states 'License: Creative Commons Attribution 4.0' (read 2026-10-29). Estimates are
      built from perception data from 35 sources; the 2026 release recalculated history back to 1996.

  - source_id: un-wpp
    publisher: United Nations, Population Division
    title: World Population Prospects 2024
    url: https://population.un.org/wpp/
    licence: CC BY 3.0 IGO
    licence_url: http://creativecommons.org/licenses/by/3.0/igo/
    tier: green
    commercial_ok: true
    derivatives_ok: true
    share_alike: false
    no_modification: false
    attribution_text: "United Nations, Department of Economic and Social Affairs, Population Division (2024). World Population Prospects 2024. CC BY 3.0 IGO."
    licence_checked_on: 2026-11-07
    notes: >-
      Read 2026-11-07 on the WPP downloads page: "Copyright © 2024 by United Nations, made available under
      a Creative Commons license CC BY 3.0 IGO". Years after 2023 are medium-variant projections.

  - source_id: undp-hdr
    publisher: UNDP Human Development Report Office
    title: Human Development Report 2025 — composite indices time series
    url: https://hdr.undp.org/data-center/documentation-and-downloads
    licence: CC BY 3.0 IGO
    licence_url: https://hdr.undp.org/terms-use
    tier: green
    commercial_ok: true
    derivatives_ok: true
    share_alike: false
    no_modification: false
    attribution_text: "UNDP Human Development Report Office, Human Development Report 2025. Licensed under CC BY 3.0 IGO."
    licence_checked_on: 2026-10-24
    notes: >-
      Read 2026-10-24 on hdr.undp.org/terms-use: CC BY 3.0 IGO, adaptation 'for any purpose, even commercially'; credit, link the licence, indicate changes, no implied endorsement.

  - source_id: natural-earth
    publisher: Natural Earth
    title: Admin 0 countries, 1:10m, India point of view (simplified)
    url: https://www.naturalearthdata.com/
    licence: Public domain
    licence_url: https://www.naturalearthdata.com/about/terms-of-use/
    tier: green
    commercial_ok: true
    derivatives_ok: true
    share_alike: false
    no_modification: false
    attribution_text: "Made with Natural Earth."
    licence_checked_on: 2026-10-24
    notes: >-
      Read 2026-10-24: 'All versions of Natural Earth raster + vector map data ... are in the public domain.' Uses the India point-of-view edition, simplified with mapshaper.

  - source_id: ti-cpi
    publisher: Transparency International
    title: Corruption Perceptions Index (2012–2024)
    url: https://www.transparency.org/en/cpi
    licence: CC BY 4.0
    licence_url: https://www.transparency.org/en/copyright-enquiries
    tier: green
    commercial_ok: true
    derivatives_ok: true
    share_alike: false
    no_modification: true      # TI asks that CPI data "should not be changed": shown raw, never in composites
    attribution_text: "Corruption Perceptions Index (2024) by Transparency International is licensed under CC BY 4.0. Source: Transparency International."
    licence_checked_on: 2026-10-21
    notes: >-
      Licence read on transparency.org/en/copyright-enquiries on 2026-10-21. Data downloaded from
      Our World in Data's republication of the TI series, because transparency.org downloads timed out.

  - source_id: oecd
    publisher: OECD
    title: OECD Data Explorer (Global Revenue Statistics; Average annual wages)
    url: https://data-explorer.oecd.org/
    licence: OECD Terms (open, attribution)
    licence_url: https://www.oecd.org/en/about/terms-conditions.html
    tier: green
    commercial_ok: true
    derivatives_ok: true
    share_alike: false
    no_modification: false
    attribution_text: "OECD (2026), OECD Data Explorer. Licensed under CC BY 4.0."
    licence_checked_on: 2026-10-24
    notes: >-
      Read 2026-10-24 on oecd.org terms: Data may be used 'for any purpose, even for commercial use' with the OECD citation, and the same acknowledgement requirement must be passed on in sub-licences (ATTRIBUTION.md does this). Third-party-owned series are excluded; both series used are OECD-compiled.

  - source_id: gdelt
    publisher: The GDELT Project
    title: GDELT 1.0 daily event files (news volume and tone)
    url: https://www.gdeltproject.org/
    licence: Open (citation and link required)
    licence_url: https://www.gdeltproject.org/about.html
    tier: green
    commercial_ok: true
    derivatives_ok: true
    share_alike: false
    no_modification: false
    attribution_text: "Data from The GDELT Project (https://www.gdeltproject.org/)."
    licence_checked_on: 2026-10-24
    notes: >-
      Read 2026-10-24 on gdeltproject.org/about: 'unlimited and unrestricted use for any academic, commercial, or governmental use'; redistribution allowed with citation and a link.

  - source_id: wikidata
    publisher: Wikimedia Foundation
    title: Wikidata (country facts, event data and country code mapping)
    url: https://www.wikidata.org/
    licence: CC0
    licence_url: https://www.wikidata.org/wiki/Wikidata:Licensing
    tier: green
    commercial_ok: true
    derivatives_ok: true
    share_alike: false
    no_modification: false
    attribution_text: "Country facts, events and code mapping from Wikidata (CC0)."
    licence_checked_on: 2026-10-24
    notes: >-
      Read 2026-10-24: structured data is CC0. Supplies country facts (languages, currency, borders and so on, corrected in data/country_facts_overrides.yaml), event dates and names, and the GDELT FIPS-to-ISO code mapping. Community-maintained, so not used for rankings.


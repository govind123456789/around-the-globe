      notes: "Licence read on v-dem.net on 2026-11-09 (CC BY-SA 4.0). Share-alike: V-Dem series are shown and ranked under CC BY-SA 4.0 and never enter this site's CC BY composite indices or the Index Builder." }
  - { source_id: openalex,      publisher: OurResearch,                title: OpenAlex institutions, url: https://openalex.org/, licence: CC0 1.0, licence_url: https://creativecommons.org/publicdomain/zero/1.0/, tier: green, commercial_ok: true, derivatives_ok: true, share_alike: false, no_modification: false,
